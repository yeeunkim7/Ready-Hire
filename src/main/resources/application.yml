spring:
  application:
    name: ready-hire-api

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ready_hire}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-init-sql: "SELECT 1"
      data-source-properties:
        # TLS는 DB_URL의 sslmode=require만 사용 (ssl 속성과 동시 사용 시 08P01)
        prepareThreshold: 0
        preferQueryMode: simple

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  webflux:
    base-path: /
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-dev-google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dev-google-client-secret-placeholder}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

jwt:
  secret: ${JWT_SECRET:replace-with-long-jwt-secret-at-least-32-bytes}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

openai:
  api:
    key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://ready-hire-vert.vercel.app}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
  subscription:
    price: 9900
    duration-days: 30

portone:
  v2:
    api-secret: ${PORTONE_V2_API_SECRET:}
    channel-key: ${PORTONE_CHANNEL_KEY:}
    base-url: ${PORTONE_BASE_URL:https://api.portone.io}
    timeout-seconds: ${PORTONE_TIMEOUT_SECONDS:10}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: info
