name: Deploy to AWS EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ready-hire-frontend/**'
      - '**.md'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH2_REDIRECT_URI: ${{ secrets.OAUTH2_REDIRECT_URI }}
          PORTONE_V2_API_SECRET: ${{ secrets.PORTONE_V2_API_SECRET }}
          PORTONE_CHANNEL_KEY: ${{ secrets.PORTONE_CHANNEL_KEY }}

      - name: Build Docker image
        run: docker build -t ready-hire-api:latest .

      - name: Save Docker image
        run: docker save ready-hire-api:latest | gzip > ready-hire-api.tar.gz

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'ready-hire-api.tar.gz,docker-compose.yml'
          target: /home/ubuntu/ready-hire

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/ready-hire
            gunzip -c ready-hire-api.tar.gz | docker load
            docker-compose down || true
            docker-compose --env-file /home/ubuntu/ready-hire/.env up -d
            docker image prune -f
